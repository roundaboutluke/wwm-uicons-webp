name: Sync upstream icons

on:
  schedule:
    # Every 15 minutes. The check job below is deliberately cheap — it reads two
    # small files and asks upstream for one SHA — so a run that finds nothing to
    # do costs seconds, and only a real upstream change pays for a full checkout.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      full:
        description: Re-render every icon, ignoring the manifest
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - outline.config.json
      - tools/outline.py
      - tools/sync_upstream.py
      - .github/workflows/sync-upstream.yml

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.probe.outputs.changed }}
      sha: ${{ steps.probe.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            outline.config.json
            .outline-state.json
          sparse-checkout-cone-mode: false

      - id: probe
        run: |
          upstream=$(python3 -c "import json;print(json.load(open('outline.config.json'))['upstream'])")
          recorded=$(python3 -c "import json;print(json.load(open('.outline-state.json'))['commit'])")
          head=$(git ls-remote "$upstream" HEAD | cut -f1)
          echo "upstream:  $upstream"
          echo "recorded:  $recorded"
          echo "remote:    $head"
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$head" != "$recorded" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "up to date, skipping the sync job" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "sha=$head" >> "$GITHUB_OUTPUT"

  sync:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - run: pip install --disable-pip-version-check -r tools/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync and re-render
        id: sync
        run: python3 tools/sync_upstream.py ${{ (inputs.full && '--full') || '' }}

      - name: Commit and push
        id: commit
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date with upstream ${{ steps.sync.outputs.short }}."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit \
            -m "Sync outlined icons with upstream ${{ steps.sync.outputs.short }}" \
            -m "Rendered ${{ steps.sync.outputs.rendered }} icon(s), deleted ${{ steps.sync.outputs.deleted }}. Full rebuild: ${{ steps.sync.outputs.full }}."
          git push

      - name: Summary
        if: always()
        run: |
          {
            echo "### Upstream sync"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Upstream commit | \`${{ steps.sync.outputs.short }}\` |"
            echo "| Icons rendered | ${{ steps.sync.outputs.rendered || '0' }} |"
            echo "| Icons deleted | ${{ steps.sync.outputs.deleted || '0' }} |"
            echo "| Full rebuild | ${{ steps.sync.outputs.full || 'n/a' }} |"
            echo "| Pushed | ${{ steps.commit.outputs.changed || 'false' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
